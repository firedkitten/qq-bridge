<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QQ Bot 控制台</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2230;
    --line: #2a3140;
    --text: #e6edf3;
    --dim: #8b949e;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 15% -10%, #182030 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .4px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(63,185,80,.7); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px rgba(248,81,73,.7); }
  .dot.warn { background: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .card {
    background: linear-gradient(180deg, rgba(28,34,48,.9), rgba(22,27,34,.92));
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--dim); margin: 0 0 12px; font-weight: 600;
  }
  .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
  .c6 { grid-column: span 6; } .c7 { grid-column: span 7; }
  .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 900px) { .c4,.c5,.c6,.c7,.c8 { grid-column: span 12; } }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13px; }
  .kv span:first-child { color: var(--dim); }
  .kv span:last-child { text-align: right; word-break: break-all; }
  .mono { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }

  .bar { height: 7px; border-radius: 999px; background: #0b0f16; overflow: hidden; margin: 6px 0 2px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2f81f7, #58a6ff); }
  .bar.warn > i { background: linear-gradient(90deg, #bb8009, #d29922); }
  .bar.bad > i { background: linear-gradient(90deg, #b62324, #f85149); }

  .svc { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed rgba(42,49,64,.8); }
  .svc:last-child { border-bottom: 0; }
  .svc .name { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .state { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .state.active { color: var(--ok); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.1); }
  .state.bad { color: var(--bad); border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.1); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    padding: 10px 15px; border-radius: 9px; color: var(--text);
    border: 1px solid var(--line); background: var(--panel-2);
    transition: .15s border-color, .15s transform, .15s background;
    font-size: 13px;
  }
  a.btn:hover { border-color: var(--accent); background: #1f2937; transform: translateY(-1px); }
  a.btn small { color: var(--dim); font-size: 11px; }
  a.btn .k { font-weight: 600; }

  .bothead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #274b78, #16202e); font-size: 22px;
    border: 1px solid var(--line);
  }
  .nick { font-size: 16px; font-weight: 650; }
  .qq { color: var(--dim); font-size: 12.5px; }
  img.avatar { object-fit: cover; background: #0b0f16; }
  .avatar-wrap { flex: 0 0 auto; display: flex; }
  [data-theme="light"] img.avatar { background: #eef1f5; }

  .groups { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .group {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 12px;
    padding: 9px 11px; background: #11161f; border-radius: 9px;
    border: 1px solid rgba(42,49,64,.7);
  }
  .group .gname {
    font-size: 13px; font-weight: 600; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group .gid {
    grid-column: 1; grid-row: 2;
    color: var(--dim); font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; letter-spacing: .2px;
  }
  .group .gcount {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    min-width: 86px;
  }
  .group .gcount b { font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .group .gcount small { color: var(--dim); font-size: 11px; }
  .group .gbar { width: 86px; height: 4px; border-radius: 999px; background: #0b0f16; overflow: hidden; }
  .group .gbar > i { display: block; height: 100%; background: linear-gradient(90deg, #2f81f7, #58a6ff); }
  .group .gbar.warn > i { background: linear-gradient(90deg, #bb8009, #d29922); }
  .group .gbar.bad > i { background: linear-gradient(90deg, #b62324, #f85149); }
  .stale { opacity: .5; filter: saturate(.6); }
  .age { color: var(--dim); }
  .age b { color: var(--text); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab {
    padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: transparent; color: var(--dim); cursor: pointer; font-size: 12.5px;
  }
  .tab.on { color: var(--text); background: var(--panel-2); border-color: var(--accent); }
  pre.log {
    margin: 0; height: 360px; overflow: auto; background: #0a0e15; border: 1px solid var(--line);
    border-radius: 9px; padding: 12px 14px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.5; color: #c9d1d9; white-space: pre-wrap; word-break: break-word;
  }
  pre.log::-webkit-scrollbar { width: 9px; }
  pre.log::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 9px; }

  .foot { margin-top: 18px; color: var(--dim); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .err { color: var(--bad); }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .toolbar label { color: var(--dim); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #2a3140; border-top-color: var(--accent); border-radius: 50%; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  html { max-width: 100%; }
  html, body { overflow-x: hidden; }

  /* ================= 右下角浮动工具坞 =================
     常驻在页面右下角。现在只有「深色 / 浅色」，但结构是通用的：
     以后要加「切换语言」「设置」等，调 window.panelDock.add({...}) 即可，
     新条目会自动叠在主题按钮上方，不用改这里的 CSS。 */
  #panelDock { position: fixed; right: 20px; bottom: 20px; z-index: 60; pointer-events: none; }
  #panelDock .dock-group {
    display: flex; flex-direction: column-reverse; align-items: center; gap: 6px;
    padding: 7px; border-radius: 15px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(0,0,0,.18); pointer-events: auto;
  }
  #panelDock .dock-item { position: relative; display: flex; }
  #panelDock .dock-btn {
    width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
    font-size: 18px; line-height: 1; border-radius: 11px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    cursor: pointer;
    transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
  }
  #panelDock .dock-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  #panelDock .dock-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panelDock .dock-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #panelDock .dock-tip {
    position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    white-space: nowrap; font-size: 12px; padding: 3px 8px; border-radius: 7px;
    background: var(--text); color: var(--panel);
    opacity: 0; pointer-events: none; transition: opacity .14s ease;
  }
  #panelDock .dock-item:hover .dock-tip,
  #panelDock .dock-btn:focus-visible + .dock-tip { opacity: 1; }
  @media (max-width: 720px) {
    #panelDock { right: 12px; bottom: 12px; }
    #panelDock .dock-btn { width: 38px; height: 38px; }
    #panelDock .dock-tip { display: none; }
  }
  @media print { #panelDock { display: none; } }

  /* ================= 浅色主题（白色简约） =================
     只覆盖颜色变量 + 几处写死深色的地方，结构一行没动。 */
  [data-theme="light"] {
    --bg: #f7f8fa; --panel: #ffffff; --panel-2: #f4f6f8; --line: #e4e8ee;
    --text: #1b2129; --dim: #6a7480;
    --ok: #1a7f37; --warn: #9a6700; --bad: #c62828; --accent: #2f6feb;
  }
  [data-theme="light"] body { background: radial-gradient(1200px 600px at 15% -10%, #ffffff 0%, var(--bg) 58%); }
  [data-theme="light"] .card {
    background: #fff;
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 26px rgba(16,24,40,.06);
  }
  [data-theme="light"] .bar, [data-theme="light"] .group .gbar { background: #eef1f5; }
  [data-theme="light"] .group { background: #fbfcfd; border-color: #e8ecf1; }
  [data-theme="light"] a.btn:hover { background: #f1f5fb; }
  [data-theme="light"] .avatar { background: radial-gradient(circle at 35% 30%, #dfe9f7, #f2f6fb); }
  [data-theme="light"] pre.log { background: #f8fafc; color: #2b3440; border-color: #e4e8ee; }
  [data-theme="light"] pre.log::-webkit-scrollbar-thumb { background: #d3dae3; }
  [data-theme="light"] .spin { border-color: #d7dde5; border-top-color: var(--accent); }
  [data-theme="light"] .svc { border-bottom-color: #edf1f5; }
  [data-theme="light"] .state.active { background: rgba(26,127,55,.08); }
  [data-theme="light"] .state.bad { background: rgba(198,40,40,.08); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QQ Bot 控制台</h1>
    <span class="chip"><i id="tunnelDot" class="dot warn"></i><span id="tunnelText">隧道连接中…</span></span>
    <span class="chip" id="hostChip">—</span>
    <span style="flex:1"></span>
    <span class="sub" id="stamp">正在读取…</span>
  </header>

  <div class="grid">
    <!-- 服务器信息 -->
    <section class="card c5">
      <h2>服务器</h2>
      <div id="hostInfo" class="mono"></div>
    </section>

    <!-- 资源 -->
    <section class="card c3" style="grid-column: span 3;">
      <h2>资源占用</h2>
      <div class="kv"><span>CPU 核心</span><span id="cores">—</span></div>
      <div class="kv"><span>负载</span><span id="load" class="mono">—</span></div>
      <div class="kv" style="margin-top:10px"><span>内存</span><span id="memText">—</span></div>
      <div class="bar" id="memBar"><i style="width:0"></i></div>
      <div class="kv" style="margin-top:10px"><span>磁盘 /</span><span id="diskText">—</span></div>
      <div class="bar" id="diskBar"><i style="width:0"></i></div>
    </section>

    <!-- 三个入口 -->
    <section class="card c4">
      <h2>入口</h2>
      <div class="actions">
        <a class="btn" id="linkConsole" target="_blank" rel="noreferrer">
          <span class="k">qq-bridge 控制台</span><small>:3100</small>
        </a>
        <a class="btn" id="linkWebui" target="_blank" rel="noreferrer">
          <span class="k">SnowLuma WebUI</span><small>:5099</small>
        </a>
        <a class="btn" id="linkVnc" target="_blank" rel="noreferrer">
          <span class="k">QQ 扫码桌面</span><small>:6081</small>
        </a>
        <a class="btn" id="linkDsh" target="_blank" rel="noreferrer" title="自动带上 DSH 的登录令牌，免去手动翻 journalctl">
          <span class="k">服务器 DSH</span><small>:3380</small>
        </a>
      </div>
      <div class="sub" style="margin-top:12px;line-height:1.7">
        noVNC 密码 <b class="mono" id="vncPw">—</b>（用户名留空）<br />
        WebUI 首次登录需同意 EULA 并改密
      </div>
    </section>

    <!-- 服务状态 -->
    <section class="card c4">
      <h2>服务状态</h2>
      <div id="services"></div>
    </section>

    <!-- 机器人 -->
    <section class="card c7" id="botCard">
      <h2>机器人 <span class="sub" id="botStamp" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h2>
      <div id="botBox" class="sub">读取中…</div>
      <div class="groups" id="groups"></div>
    </section>

    <!-- 版本 -->
    <section class="card c5">
      <h2>运行环境</h2>
      <div id="versions" class="mono sub"></div>
      <div style="margin-top:10px" id="dockerBox" class="mono sub"></div>
    </section>

    <!-- 日志 -->
    <section class="card c12">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
        <h2 style="margin:0">运行日志</h2>
        <div class="toolbar">
          <div class="tabs" style="margin:0">
            <button class="tab on" data-src="bridge">bridge</button>
            <button class="tab" data-src="snowluma">snowluma</button>
            <button class="tab" data-src="sl-app">snowluma 应用日志</button>
            <button class="tab" data-src="dsh">dsh</button>
          </div>
          <label><input type="checkbox" id="autoLog" checked /> 自动刷新</label>
          <button class="tab" id="reloadLog">刷新</button>
        </div>
      </div>
      <pre class="log" id="logBox">载入中…</pre>
    </section>
  </div>

  <div class="foot">
    <button class="tab" id="reloadAll" title="跳过 4 秒缓存，立刻重新读取一次">立即刷新</button>
    <span id="footErr"></span>
    <span>面板只监听 127.0.0.1 · 关闭启动窗口即断开隧道</span>
  </div>
</div>

<!-- 右下角浮动工具坞：常驻，不随页面滚动消失；新工具用 window.panelDock.add() 追加 -->
<div id="panelDock" role="toolbar" aria-label="面板工具">
  <div class="dock-group" id="panelDockGroup">
    <div class="dock-item">
      <button id="themeToggle" class="dock-btn" type="button" aria-label="切换浅色模式" aria-pressed="false" title="深色 / 浅色">☾</button>
      <span class="dock-tip">深色 / 浅色</span>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let CONFIG = null;
let logSrc = 'bridge';
let logTimer = null;
let statusTimer = null;

function fmtGiB(mb) { return (mb / 1024).toFixed(2) + ' GiB'; }
function pct(used, total) { return total ? Math.round(used / total * 100) : 0; }
function barClass(p) { return p >= 90 ? 'bar bad' : p >= 75 ? 'bar warn' : 'bar'; }
function setBar(el, p) {
  el.className = barClass(p);
  el.firstElementChild.style.width = Math.min(100, p) + '%';
}

async function loadConfig() {
  CONFIG = await (await fetch('/api/config')).json();
  $('vncPw').textContent = CONFIG.vncPassword;

  // 本地端口按 panel.config.json 的 forwards 推出来（左=本地，右=服务器），换端口也不会链接失效
  const ports = CONFIG.ports || {};
  const localFor = (remote) => {
    const hit = Object.entries(ports).find(([, r]) => Number(r) === remote);
    return hit ? hit[0] : String(remote);
  };
  const pConsole = localFor(3100);
  const pWebui = localFor(5099);
  const pVnc = localFor(6081);

  $('linkConsole').href = `http://127.0.0.1:${pConsole}/?token=${encodeURIComponent(CONFIG.consoleToken)}`;
  $('linkWebui').href = `http://127.0.0.1:${pWebui}/`;
  $('linkVnc').href = `http://127.0.0.1:${pVnc}/vnc.html?autoconnect=1&resize=scale`;
  document.querySelector('#linkConsole small').textContent = ':' + pConsole;
  document.querySelector('#linkWebui small').textContent = ':' + pWebui;
  document.querySelector('#linkVnc small').textContent = ':' + pVnc;

  // 服务器 DSH：登录令牌每次 dsh-web 重启都会变，所以不写死在链接里，
  // 点击时现取一次（/api/dsh-token），拼到 URL 上完成一次性登录。
  const pDsh = localFor(3080);
  const dshBase = `http://127.0.0.1:${pDsh}/`;
  document.querySelector('#linkDsh small').textContent = ':' + pDsh;
  $('linkDsh').href = dshBase;
  $('linkDsh').addEventListener('click', async (ev) => {
    ev.preventDefault();
    const win = window.open('', '_blank');           // 同步打开，避免被弹窗拦截
    try {
      const r = await (await fetch('/api/dsh-token')).json();
      const url = r.ok && r.token ? `${dshBase}?token=${encodeURIComponent(r.token)}` : dshBase;
      if (win) win.location.href = url; else location.href = url;
      if (!r.ok) note(`DSH 登录令牌读取失败：${r.error || '未知错误'}（已打开普通地址，可能显示 401）`, true);
    } catch (err) {
      if (win) win.location.href = dshBase;
      note(`DSH 登录令牌读取失败：${err?.message ?? err}`, true);
    }
  });
}

let noteTimer = null;
function note(text, isErr = false) {
  const el = $('footErr');
  el.textContent = text;
  el.className = isErr ? 'err' : '';
  clearTimeout(noteTimer);
  if (text) noteTimer = setTimeout(() => { el.textContent = ''; }, 8000);
}

function renderTunnel(t) {
  const dot = $('tunnelDot');
  const txt = $('tunnelText');
  if (t === 'up') { dot.className = 'dot ok'; txt.textContent = '隧道已连接'; }
  else if (t === 'starting') { dot.className = 'dot warn'; txt.textContent = '隧道连接中…'; }
  else { dot.className = 'dot bad'; txt.textContent = '隧道已断开（自动重连）'; }
}

let lastOkAt = 0;

// ---------------- 机器人卡片 ----------------
// 结构只建一次，之后只改文字和头像 src：每 5 秒重建 innerHTML 会让头像反复重新请求/闪烁。
let botAvatarUin = '';
function botAvatarUrl(uin) {
  // 走面板自己的 /api/avatar 代取（server.mjs 里转发腾讯图床）：
  // 浏览器只跟 127.0.0.1 打交道，不受第三方资源拦截/跨域影响，拉不到时也能明确失败。
  // 带小时级 t：换了头像最多 1 小时自动刷到新的，又不会每次轮询都重新下载（服务端还带 1h 缓存）。
  const bucket = Math.floor(Date.now() / 3600000);
  return `/api/avatar?uin=${encodeURIComponent(uin)}&t=${bucket}`;
}
function renderBot(bot, botError) {
  const box = $('botBox');
  if (!bot) {
    box.innerHTML = `<div class="err">机器人未在线${botError ? '：' + escapeHtml(botError) : ''}</div>`;
    botAvatarUin = '';
    return;
  }
  const uin = String(bot.user_id ?? '');
  if (!box.querySelector('.bothead')) {
    box.innerHTML = `
      <div class="bothead">
        <div class="avatar-wrap"><img id="botAvatar" class="avatar" alt="机器人头像" referrerpolicy="no-referrer" /></div>
        <div>
          <div class="nick" id="botNick">—</div>
          <div class="qq mono" id="botUin">QQ —</div>
        </div>
      </div>`;
    bindAvatarError();
  }
  $('botNick').textContent = bot.nickname || '—';
  $('botUin').textContent = 'QQ ' + uin;
  let img = $('botAvatar');
  if (!img) {
    // 上一次加载失败已经把 <img> 换成了 🐟 兜底，这里重建一个，
    // 否则头像一旦失败就永远回不来了（直到刷新页面）。
    const wrap = box.querySelector('.avatar-wrap');
    if (wrap) {
      wrap.innerHTML = '<img id="botAvatar" class="avatar" alt="机器人头像" referrerpolicy="no-referrer" />';
      bindAvatarError();
      img = $('botAvatar');
      botAvatarUin = '';
    }
  }
  if (img && uin && botAvatarUin !== uin) {
    botAvatarUin = uin;
    img.src = botAvatarUrl(uin);
  }
}

function bindAvatarError() {
  const img = $('botAvatar');
  if (!img) return;
  img.addEventListener('error', () => {
    // 头像拉不到（离线 / 图床抽风 / 号码异常）→ 退回原来的鲸鱼 emoji，别留破图
    const cur = $('botAvatar');
    if (cur && cur.parentElement) {
      cur.parentElement.innerHTML = '<div class="avatar" title="头像加载失败（已退回默认图标）">🐟</div>';
    }
  });
}

function renderStatus(s) {
  if (!s.ok) {
    // 失败时不再把整块清空：保留上一次的数据，只把它标灰 + 顶部提示，
    // 否则一断线（哪怕只有 5 秒）机器人/群列表就整块消失，看起来像"永远不更新"。
    $('hostInfo').innerHTML = `<div class="err">读取失败：${escapeHtml(s.error || '未知错误')}</div>`;
    $('stamp').textContent = '更新失败 · ' + new Date().toLocaleTimeString('zh-CN');
    $('stamp').className = 'sub err';
    $('botCard').classList.add('stale');
    renderTunnel(s.tunnel || 'down');
    return;
  }
  lastOkAt = Date.now();
  $('botCard').classList.remove('stale');
  $('stamp').className = 'sub';
  $('stamp').innerHTML = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  renderTunnel(s.tunnel);

  const h = s.host || {};
  const name = h.name || '—';
  $('hostChip').textContent = name;
  const rows = [
    ['主机', name],
    ['系统', h.os],
    ['内核', h.kernel],
    ['虚拟化', h.virt],
    ['运行时长', s.uptime],
  ].filter(r => r[1]);
  $('hostInfo').innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><span>${k}</span><span>${escapeHtml(v)}</span></div>`).join('');

  $('cores').textContent = s.cpu?.cores ?? '—';
  $('load').textContent = s.load || '—';
  const mp = pct(s.mem.used, s.mem.total);
  $('memText').textContent = `${fmtGiB(s.mem.used)} / ${fmtGiB(s.mem.total)} (${mp}%)`;
  setBar($('memBar'), mp);
  const dp = parseInt(String(s.disk.pct || '0').replace('%', ''), 10) || 0;
  $('diskText').textContent = `${s.disk.used} / ${s.disk.total} (${s.disk.pct || ''})`;
  setBar($('diskBar'), dp);

  $('services').innerHTML = (s.services || []).map(sv => {
    const ok = sv.state === 'active';
    return `<div class="svc"><span class="name">${escapeHtml(sv.name)}</span>
      <span class="state ${ok ? 'active' : 'bad'}">${escapeHtml(sv.state)}</span></div>`;
  }).join('') || '<div class="sub">—</div>';

  renderBot(s.bot, s.botError);

  const gs = s.groups || [];
  $('botStamp').textContent = gs.length ? ` 群聊 ${gs.length}` : '';
  $('groups').innerHTML = gs.length
    ? gs.map((g) => {
        const members = Number(g.members) || 0;
        const max = Number(g.max) || 0;
        const gp = max ? Math.min(100, Math.round(members / max * 100)) : 0;
        const bc = gp >= 90 ? 'gbar bad' : gp >= 75 ? 'gbar warn' : 'gbar';
        return `<div class="group">
          <div class="gname" title="${escapeHtml(g.name || '未命名群')}">${escapeHtml(g.name || '未命名群')}</div>
          <div class="gcount" title="当前成员数 / 群人数上限（实时来自 OneBot get_group_list no_cache）">
            <b>${members}${max ? ' / ' + max : ''}</b>
            <div class="${bc}"><i style="width:${gp}%"></i></div>
          </div>
          <div class="gid">群号 ${escapeHtml(String(g.id ?? ''))}</div>
        </div>`;
      }).join('')
    : '<div class="sub" style="margin-top:6px">没有加入任何群</div>';

  $('versions').innerHTML = (s.versions || []).map(v => `<div>${escapeHtml(v)}</div>`).join('') || '—';
  $('dockerBox').innerHTML = (s.docker || []).length
    ? s.docker.map(d => `<div>${escapeHtml(d.name)} · ${escapeHtml(d.status)}</div>`).join('')
    : '<div>没有运行中的容器</div>';
}

// 每秒刷新一次"数据年龄"，让人一眼看出面板是不是卡住了（比静态时间戳直观）
function tickAge() {
  const el = $('stamp');
  if (!lastOkAt || el.className.includes('err')) return;
  const s = Math.max(0, Math.round((Date.now() - lastOkAt) / 1000));
  const age = s < 60 ? `${s} 秒前` : `${Math.round(s / 60)} 分钟前`;
  el.innerHTML = `更新于 ${new Date(lastOkAt).toLocaleTimeString('zh-CN')} · <b>${age}</b>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function pollStatus(force = false) {
  try {
    const s = await (await fetch('/api/status' + (force ? '?fresh=1' : ''))).json();
    renderStatus(s);
    $('footErr').textContent = '';
  } catch (err) {
    $('tunnelDot').className = 'dot bad';
    $('tunnelText').textContent = '面板与本地服务失联';
    $('footErr').textContent = String(err?.message ?? err);
  }
}

async function loadLogs() {
  $('logBox').textContent = '载入中…';
  try {
    const r = await (await fetch(`/api/logs?src=${logSrc}&n=300`)).json();
    const text = r.text || '（没有输出）';
    const box = $('logBox');
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = text;
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (err) {
    $('logBox').textContent = '读取失败：' + (err?.message ?? err);
  }
}

document.querySelectorAll('.tab[data-src]').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tab[data-src]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    logSrc = el.dataset.src;
    loadLogs();
  });
});
$('reloadLog').addEventListener('click', loadLogs);
$('autoLog').addEventListener('change', () => {
  clearInterval(logTimer);
  if ($('autoLog').checked) logTimer = setInterval(() => { if (!document.hidden) loadLogs(); }, 5000);
});

// ---------------- 右下角工具坞：深色 / 浅色 + 扩展入口 ----------------
// 主题存在 localStorage，刷新后保持；默认深色（和以前一致）。
const THEME_KEY = 'panel-theme';
function applyTheme(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  const btn = $('themeToggle');
  if (btn) {
    btn.textContent = t === 'light' ? '☀' : '☾';
    btn.setAttribute('aria-pressed', String(t === 'light'));
    btn.setAttribute('aria-label', t === 'light' ? '切换深色模式' : '切换浅色模式');
  }
}
try { applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark'); } catch { applyTheme('dark'); }
$('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch {}
});

// 以后加「切换语言」「设置」等：window.panelDock.add({ id, icon, label, tip, onClick, pressed })
// 布局是 column-reverse，新加的在上面，主题按钮永远在最下面。
window.panelDock = (function () {
  function add(item) {
    if (!item || !item.id) return null;
    if (document.getElementById(item.id)) return document.getElementById(item.id);
    const group = $('panelDockGroup');
    if (!group) return null;
    const wrap = document.createElement('div');
    wrap.className = 'dock-item';
    const btn = document.createElement('button');
    btn.id = item.id;
    btn.type = 'button';
    btn.className = 'dock-btn';
    btn.textContent = item.icon || '•';
    const label = item.label || item.id;
    btn.setAttribute('aria-label', label);
    btn.title = item.tip || label;
    if (item.pressed) btn.setAttribute('aria-pressed', 'true');
    if (typeof item.onClick === 'function') btn.addEventListener('click', item.onClick);
    wrap.appendChild(btn);
    if (item.tip) {
      const tip = document.createElement('span');
      tip.className = 'dock-tip';
      tip.textContent = item.tip;
      wrap.appendChild(tip);
    }
    group.appendChild(wrap);
    return btn;
  }
  return { add };
})();

(async function init() {
  await loadConfig();
  await pollStatus(true);
  await loadLogs();
  $('reloadAll').addEventListener('click', () => pollStatus(true));
  statusTimer = setInterval(() => { if (!document.hidden) pollStatus(); }, 5000);
  logTimer = setInterval(() => { if (!document.hidden && $('autoLog').checked) loadLogs(); }, 5000);
  setInterval(tickAge, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollStatus(true); });
})();
</script>
