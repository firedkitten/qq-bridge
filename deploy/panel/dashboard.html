<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QQ Bot 控制台</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2230;
    --line: #2a3140;
    --text: #e6edf3;
    --dim: #8b949e;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 15% -10%, #182030 0%, var(--bg) 55%);
    color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .4px; font-weight: 650; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(63,185,80,.7); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px rgba(248,81,73,.7); }
  .dot.warn { background: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .card {
    background: linear-gradient(180deg, rgba(28,34,48,.9), rgba(22,27,34,.92));
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--dim); margin: 0 0 12px; font-weight: 600;
  }
  .c4 { grid-column: span 4; } .c5 { grid-column: span 5; }
  .c6 { grid-column: span 6; } .c7 { grid-column: span 7; }
  .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 900px) { .c4,.c5,.c6,.c7,.c8 { grid-column: span 12; } }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13px; }
  .kv span:first-child { color: var(--dim); }
  .kv span:last-child { text-align: right; word-break: break-all; }
  .mono { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }

  .bar { height: 7px; border-radius: 999px; background: #0b0f16; overflow: hidden; margin: 6px 0 2px; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2f81f7, #58a6ff); }
  .bar.warn > i { background: linear-gradient(90deg, #bb8009, #d29922); }
  .bar.bad > i { background: linear-gradient(90deg, #b62324, #f85149); }

  .svc { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed rgba(42,49,64,.8); }
  .svc:last-child { border-bottom: 0; }
  .svc .name { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .state { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .state.active { color: var(--ok); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.1); }
  .state.bad { color: var(--bad); border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.1); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    padding: 10px 15px; border-radius: 9px; color: var(--text);
    border: 1px solid var(--line); background: var(--panel-2);
    transition: .15s border-color, .15s transform, .15s background;
    font-size: 13px;
  }
  a.btn:hover { border-color: var(--accent); background: #1f2937; transform: translateY(-1px); }
  a.btn small { color: var(--dim); font-size: 11px; }
  a.btn .k { font-weight: 600; }

  .bothead { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #274b78, #16202e); font-size: 22px;
    border: 1px solid var(--line);
  }
  .nick { font-size: 16px; font-weight: 650; }
  .qq { color: var(--dim); font-size: 12.5px; }

  .groups { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .group { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 6px 9px; background: #11161f; border-radius: 7px; border: 1px solid rgba(42,49,64,.7); }
  .group .id { color: var(--dim); font-family: ui-monospace, monospace; }

  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tab {
    padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: transparent; color: var(--dim); cursor: pointer; font-size: 12.5px;
  }
  .tab.on { color: var(--text); background: var(--panel-2); border-color: var(--accent); }
  pre.log {
    margin: 0; height: 360px; overflow: auto; background: #0a0e15; border: 1px solid var(--line);
    border-radius: 9px; padding: 12px 14px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.5; color: #c9d1d9; white-space: pre-wrap; word-break: break-word;
  }
  pre.log::-webkit-scrollbar { width: 9px; }
  pre.log::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 9px; }

  .foot { margin-top: 18px; color: var(--dim); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .err { color: var(--bad); }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  .toolbar label { color: var(--dim); font-size: 12px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #2a3140; border-top-color: var(--accent); border-radius: 50%; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  html { max-width: 100%; }
  html, body { overflow-x: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QQ Bot 控制台</h1>
    <span class="chip"><i id="tunnelDot" class="dot warn"></i><span id="tunnelText">隧道连接中…</span></span>
    <span class="chip" id="hostChip">—</span>
    <span style="flex:1"></span>
    <span class="sub" id="stamp">正在读取…</span>
  </header>

  <div class="grid">
    <!-- 服务器信息 -->
    <section class="card c5">
      <h2>服务器</h2>
      <div id="hostInfo" class="mono"></div>
    </section>

    <!-- 资源 -->
    <section class="card c3" style="grid-column: span 3;">
      <h2>资源占用</h2>
      <div class="kv"><span>CPU 核心</span><span id="cores">—</span></div>
      <div class="kv"><span>负载</span><span id="load" class="mono">—</span></div>
      <div class="kv" style="margin-top:10px"><span>内存</span><span id="memText">—</span></div>
      <div class="bar" id="memBar"><i style="width:0"></i></div>
      <div class="kv" style="margin-top:10px"><span>磁盘 /</span><span id="diskText">—</span></div>
      <div class="bar" id="diskBar"><i style="width:0"></i></div>
    </section>

    <!-- 三个入口 -->
    <section class="card c4">
      <h2>入口</h2>
      <div class="actions">
        <a class="btn" id="linkConsole" target="_blank" rel="noreferrer">
          <span class="k">qq-bridge 控制台</span><small>:3100</small>
        </a>
        <a class="btn" id="linkWebui" target="_blank" rel="noreferrer">
          <span class="k">SnowLuma WebUI</span><small>:5099</small>
        </a>
        <a class="btn" id="linkVnc" target="_blank" rel="noreferrer">
          <span class="k">QQ 扫码桌面</span><small>:6081</small>
        </a>
      </div>
      <div class="sub" style="margin-top:12px;line-height:1.7">
        noVNC 密码 <b class="mono" id="vncPw">—</b>（用户名留空）<br />
        WebUI 首次登录需同意 EULA 并改密
      </div>
    </section>

    <!-- 服务状态 -->
    <section class="card c4">
      <h2>服务状态</h2>
      <div id="services"></div>
    </section>

    <!-- 机器人 -->
    <section class="card c7">
      <h2>机器人</h2>
      <div id="botBox" class="sub">读取中…</div>
      <div class="groups" id="groups"></div>
    </section>

    <!-- 版本 -->
    <section class="card c5">
      <h2>运行环境</h2>
      <div id="versions" class="mono sub"></div>
      <div style="margin-top:10px" id="dockerBox" class="mono sub"></div>
    </section>

    <!-- 日志 -->
    <section class="card c12">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">
        <h2 style="margin:0">运行日志</h2>
        <div class="toolbar">
          <div class="tabs" style="margin:0">
            <button class="tab on" data-src="bridge">bridge</button>
            <button class="tab" data-src="snowluma">snowluma</button>
            <button class="tab" data-src="sl-app">snowluma 应用日志</button>
            <button class="tab" data-src="dsh">dsh</button>
          </div>
          <label><input type="checkbox" id="autoLog" checked /> 自动刷新</label>
          <button class="tab" id="reloadLog">刷新</button>
        </div>
      </div>
      <pre class="log" id="logBox">载入中…</pre>
    </section>
  </div>

  <div class="foot">
    <span id="footErr"></span>
    <span>面板只监听 127.0.0.1 · 关闭启动窗口即断开隧道</span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let CONFIG = null;
let logSrc = 'bridge';
let logTimer = null;
let statusTimer = null;

function fmtGiB(mb) { return (mb / 1024).toFixed(2) + ' GiB'; }
function pct(used, total) { return total ? Math.round(used / total * 100) : 0; }
function barClass(p) { return p >= 90 ? 'bar bad' : p >= 75 ? 'bar warn' : 'bar'; }
function setBar(el, p) {
  el.className = barClass(p);
  el.firstElementChild.style.width = Math.min(100, p) + '%';
}

async function loadConfig() {
  CONFIG = await (await fetch('/api/config')).json();
  $('vncPw').textContent = CONFIG.vncPassword;

  // 本地端口按 panel.config.json 的 forwards 推出来（左=本地，右=服务器），换端口也不会链接失效
  const ports = CONFIG.ports || {};
  const localFor = (remote) => {
    const hit = Object.entries(ports).find(([, r]) => Number(r) === remote);
    return hit ? hit[0] : String(remote);
  };
  const pConsole = localFor(3100);
  const pWebui = localFor(5099);
  const pVnc = localFor(6081);

  $('linkConsole').href = `http://127.0.0.1:${pConsole}/?token=${encodeURIComponent(CONFIG.consoleToken)}`;
  $('linkWebui').href = `http://127.0.0.1:${pWebui}/`;
  $('linkVnc').href = `http://127.0.0.1:${pVnc}/vnc.html?autoconnect=1&resize=scale`;
  document.querySelector('#linkConsole small').textContent = ':' + pConsole;
  document.querySelector('#linkWebui small').textContent = ':' + pWebui;
  document.querySelector('#linkVnc small').textContent = ':' + pVnc;
}

function renderTunnel(t) {
  const dot = $('tunnelDot');
  const txt = $('tunnelText');
  if (t === 'up') { dot.className = 'dot ok'; txt.textContent = '隧道已连接'; }
  else if (t === 'starting') { dot.className = 'dot warn'; txt.textContent = '隧道连接中…'; }
  else { dot.className = 'dot bad'; txt.textContent = '隧道已断开（自动重连）'; }
}

function renderStatus(s) {
  if (!s.ok) {
    $('hostInfo').innerHTML = `<div class="err">读取失败：${escapeHtml(s.error || '未知错误')}</div>`;
    $('stamp').textContent = '更新失败 · ' + new Date().toLocaleTimeString('zh-CN');
    $('stamp').className = 'sub err';
    renderTunnel(s.tunnel || 'down');
    return;
  }
  $('stamp').className = 'sub';
  $('stamp').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  renderTunnel(s.tunnel);

  const h = s.host || {};
  const name = h.name || '—';
  $('hostChip').textContent = name;
  const rows = [
    ['主机', name],
    ['系统', h.os],
    ['内核', h.kernel],
    ['虚拟化', h.virt],
    ['运行时长', s.uptime],
  ].filter(r => r[1]);
  $('hostInfo').innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><span>${k}</span><span>${escapeHtml(v)}</span></div>`).join('');

  $('cores').textContent = s.cpu?.cores ?? '—';
  $('load').textContent = s.load || '—';
  const mp = pct(s.mem.used, s.mem.total);
  $('memText').textContent = `${fmtGiB(s.mem.used)} / ${fmtGiB(s.mem.total)} (${mp}%)`;
  setBar($('memBar'), mp);
  const dp = parseInt(String(s.disk.pct || '0').replace('%', ''), 10) || 0;
  $('diskText').textContent = `${s.disk.used} / ${s.disk.total} (${s.disk.pct || ''})`;
  setBar($('diskBar'), dp);

  $('services').innerHTML = (s.services || []).map(sv => {
    const ok = sv.state === 'active';
    return `<div class="svc"><span class="name">${escapeHtml(sv.name)}</span>
      <span class="state ${ok ? 'active' : 'bad'}">${escapeHtml(sv.state)}</span></div>`;
  }).join('') || '<div class="sub">—</div>';

  if (s.bot) {
    $('botBox').innerHTML = `
      <div class="bothead">
        <div class="avatar">🐟</div>
        <div>
          <div class="nick">${escapeHtml(s.bot.nickname || '—')}</div>
          <div class="qq mono">QQ ${escapeHtml(String(s.bot.user_id))}</div>
        </div>
      </div>`;
  } else {
    $('botBox').innerHTML = `<div class="err">机器人未在线${s.botError ? '：' + escapeHtml(s.botError) : ''}</div>`;
  }

  $('groups').innerHTML = (s.groups || []).length
    ? s.groups.map(g => `<div class="group"><span>${escapeHtml(g.name || '未命名群')}</span>
        <span class="id">${g.id} · ${g.members}/${g.max}</span></div>`).join('')
    : '<div class="sub" style="margin-top:6px">没有加入任何群</div>';

  $('versions').innerHTML = (s.versions || []).map(v => `<div>${escapeHtml(v)}</div>`).join('') || '—';
  $('dockerBox').innerHTML = (s.docker || []).length
    ? s.docker.map(d => `<div>${escapeHtml(d.name)} · ${escapeHtml(d.status)}</div>`).join('')
    : '<div>没有运行中的容器</div>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function pollStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    renderStatus(s);
    $('footErr').textContent = '';
  } catch (err) {
    $('tunnelDot').className = 'dot bad';
    $('tunnelText').textContent = '面板与本地服务失联';
    $('footErr').textContent = String(err?.message ?? err);
  }
}

async function loadLogs() {
  $('logBox').textContent = '载入中…';
  try {
    const r = await (await fetch(`/api/logs?src=${logSrc}&n=300`)).json();
    const text = r.text || '（没有输出）';
    const box = $('logBox');
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = text;
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (err) {
    $('logBox').textContent = '读取失败：' + (err?.message ?? err);
  }
}

document.querySelectorAll('.tab[data-src]').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tab[data-src]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    logSrc = el.dataset.src;
    loadLogs();
  });
});
$('reloadLog').addEventListener('click', loadLogs);
$('autoLog').addEventListener('change', () => {
  clearInterval(logTimer);
  if ($('autoLog').checked) logTimer = setInterval(() => { if (!document.hidden) loadLogs(); }, 5000);
});

(async function init() {
  await loadConfig();
  await pollStatus();
  await loadLogs();
  statusTimer = setInterval(() => { if (!document.hidden) pollStatus(); }, 5000);
  logTimer = setInterval(() => { if (!document.hidden && $('autoLog').checked) loadLogs(); }, 5000);
})();
</script>
</body>
</html>
